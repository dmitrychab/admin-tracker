<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Tracker PRO — GTA RP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D0D;
      --card-bg: rgba(24, 24, 30, 0.85);
      --cyan: #00F0FF;
      --magenta: #FF007F;
      --green: #00FF66;
      --red: #FF2A4B;
      --text: #F5F7FA;
      --muted: #8A93A2;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050507;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 10%, rgba(0, 240, 255, 0.08), transparent 40%),
                  radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.08), transparent 45%),
                  var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 84px;
      overflow-x: hidden;
      border-left: 1px solid rgba(255,255,255,0.04);
      border-right: 1px solid rgba(255,255,255,0.04);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .profile-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .profile-btn:active { transform: scale(0.94); }

    /* Screens */
    .screen {
      display: none;
      padding: 0 18px 20px;
      flex: 1;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Premium Banner */
    .premium-banner {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.22), rgba(0, 240, 255, 0.16));
      border: 1px solid rgba(255, 0, 127, 0.45);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.18), inset 0 1px 0 rgba(255,255,255,0.2);
      cursor: pointer;
    }

    .premium-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .infinity-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--magenta);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px var(--magenta);
    }

.premium-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #fff;
    }
